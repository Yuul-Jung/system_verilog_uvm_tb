<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="pwm-title pwm-desc">
<title id="pwm-title">pwm_core 내부 구조</title><desc id="pwm-desc">설정값은 Shadow에 저장되고 주기 경계에서 Active로 반영된다. 카운터와 Active 설정으로 PWM 출력을 만든다.</desc>

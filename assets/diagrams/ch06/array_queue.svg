<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="ch06title ch06desc">
<title id="ch06title">배열 인덱스와 기대값 큐</title><desc id="ch06desc">packed_bytes의 인덱스 3, 2, 1, 0을 unpacked_bytes의 0, 1, 2, 3으로 복사한 후 A, B, C, D 순서대로 expected_q에 추가한다.</desc>
<defs><marker id="ch06arr" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#5A1E1E"/></marker></defs>

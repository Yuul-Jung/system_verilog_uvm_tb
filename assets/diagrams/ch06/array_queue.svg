<text x="24" y="171" font-weight="bold">unpacked_bytes</text><text x="24" y="192" font-size="13">[7:0] [0:3]</text>
<text x="24" y="258" font-weight="bold">expected_q</text><text x="24" y="279" font-size="13">[7:0] [$]</text>

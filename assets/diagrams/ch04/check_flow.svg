<g font-size="16" font-weight="bold"><text x="109" y="100">apply_duty()</text><text x="325" y="100">pwm_core</text><text x="551" y="100">check_period()</text><text x="109" y="241">duty_ticks</text><text x="810" y="171">검사 결과 집계</text></g>
<g font-size="13"><text x="109" y="125">cfg_duty · cfg_apply</text><text x="325" y="125">실제 PWM 출력</text><text x="551" y="125">high_count 계산</text><text x="109" y="266">독립 기대 HIGH 수</text><text x="810" y="196">checks · errors</text></g>
<g stroke="#5A1E1E" stroke-width="2" fill="none" marker-end="url(#ch04arrow)"><path d="M194 109H240"/><path d="M410 109H456"/><path d="M551 143V161"/><path d="M194 250H551V222"/><path d="M661 191H710"/></g>

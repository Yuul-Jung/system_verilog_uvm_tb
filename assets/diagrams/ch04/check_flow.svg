<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-labelledby="ch04title ch04desc">
<title id="ch04title">PWM 자동 판정 데이터 흐름</title><desc id="ch04desc">입력 듀티는 PWM 코어와 독립 기대값 비교에 사용되고, 실제 HIGH 개수와 기대값을 비교해 오류를 누적한다.</desc>
<defs><marker id="ch04arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#5A1E1E"/></marker></defs>
<rect width="940" height="350" fill="white"/>
<g font-family="Noto Sans CJK KR,sans-serif" fill="#172439" text-anchor="middle">
